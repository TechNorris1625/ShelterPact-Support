title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Public bug reports must use test data only. For sensitive incidents or security issues, email support@shelterpact.com instead."
  - type: input
    id: feature
    attributes:
      label: Affected feature
      placeholder: "Example: Outcomes > Adoption"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (test data only)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: "Example: Chrome on Windows 11"
    validations:
      required: false
